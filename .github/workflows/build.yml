name: Build VulkanFX

on:
  push:
    branches: [ VulkanFX, main, master ]
  pull_request:
    branches: [ VulkanFX, main, master ]
  workflow_dispatch:

jobs:
  build-meson:
    name: Build with Meson (Ubuntu)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build \
          libvulkan-dev vulkan-headers \
          libx11-dev libxrandr-dev \
          gcc g++ pkg-config
    
    - name: Setup build
      run: meson setup build
    
    - name: Build
      run: ninja -C build
    
    - name: List built files
      run: |
        echo "Built libraries:"
        ls -lh build/src/*.so
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-meson-ubuntu
        path: |
          build/src/*.so
          build/config/VulkanFX.json
        retention-days: 30

  build-cmake:
    name: Build with CMake (Ubuntu)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake ninja-build \
          libvulkan-dev vulkan-headers \
          libx11-dev libxrandr-dev \
          gcc g++ pkg-config
    
    - name: Configure CMake
      run: cmake -B build_cmake -G Ninja -DBUILD_ALL_VARIANTS=ON
    
    - name: Build
      run: cmake --build build_cmake -j$(nproc)
    
    - name: List built files
      run: |
        echo "Built libraries:"
        find build_cmake -name "*.so" -type f -exec ls -lh {} \;
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-cmake-ubuntu
        path: |
          build_cmake/*.so
        retention-days: 30

  build-android:
    name: Build for Android (NDK)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
    
    - name: Build with CMake + NDK
      run: |
        cmake -B build_android \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DBUILD_ALL_VARIANTS=ON
        cmake --build build_android -j$(nproc)
    
    - name: List built files
      run: |
        echo "Built Android libraries:"
        find build_android -name "*.so" -type f -exec ls -lh {} \;
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-android-arm64
        path: |
          build_android/*.so
        retention-days: 30

  build-multi-arch:
    name: Build Multiple Architectures
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build \
          libvulkan-dev vulkan-headers \
          libx11-dev \
          gcc g++ pkg-config
    
    - name: Build for ${{ matrix.arch }}
      run: |
        meson setup build_${{ matrix.arch }}
        ninja -C build_${{ matrix.arch }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-${{ matrix.arch }}
        path: |
          build_${{ matrix.arch }}/src/*.so
        retention-days: 30

  create-release:
    name: Create Release Package
    needs: [build-meson, build-cmake, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/VulkanFX'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create release package
      run: |
        mkdir -p release/lib
        mkdir -p release/config
        mkdir -p release/docs
        
        # Copy libraries
        find artifacts -name "*.so" -exec cp {} release/lib/ \;
        
        # Copy configs
        cp config/VulkanFX.conf release/config/ || true
        cp build/config/VulkanFX.json release/config/ || true
        
        # Copy documentation
        cp README.md release/docs/
        cp BUILD_SYSTEMS.md release/docs/ || true
        cp WINLATOR_GUIDE.md release/docs/ || true
        cp CHANGELOG.md release/docs/ || true
        
        # Create archive
        cd release
        tar -czf ../VulkanFX-$(date +%Y%m%d).tar.gz *
        cd ..
        
        ls -lh VulkanFX-*.tar.gz
    
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-release-package
        path: VulkanFX-*.tar.gz
        retention-days: 90
