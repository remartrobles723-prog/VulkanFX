name: Build VulkanFX

on:
  push:
    branches: [ VulkanFX, main, master ]
  pull_request:
    branches: [ VulkanFX, main, master ]
  workflow_dispatch:

jobs:
  build-linux-glibc:
    name: Build for Linux (Glibc)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build \
          libvulkan-dev vulkan-headers \
          libx11-dev libxrandr-dev \
          gcc g++ pkg-config
    
    - name: Setup build
      run: |
        echo "=== Meson Setup for Linux (Glibc) ==="
        echo "Build type: release"
        echo "Platform: Linux x86_64"
        echo "Libc: Glibc"
        meson setup build
        echo "=== Meson configuration complete ==="
    
    - name: Build
      run: |
        echo "=== Building with Ninja ==="
        ninja -C build -v
        echo "=== Build complete ==="
    
    - name: List built files
      run: |
        echo "=== Built Libraries (Glibc) ==="
        echo "Checking file types:"
        file build/src/*.so
        echo ""
        echo "File sizes:"
        ls -lh build/src/*.so
        echo ""
        echo "Library dependencies:"
        ldd build/src/libVkLayer_VulkanFX_default.so || true
        echo ""
        echo "=== Build artifacts ready ==="
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-linux-glibc-x86_64
        path: |
          build/src/*.so
          build/config/VulkanFX.json
        retention-days: 30

  build-android-bionic:
    name: Build for Android (Bionic)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true
    
    - name: Install Meson
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip ninja-build
        pip3 install meson
    
    - name: Create Meson cross-file for Android
      run: |
        echo "=== Creating Android NDK Cross-Compilation File ==="
        echo "NDK: $ANDROID_NDK_HOME"
        echo "Target: aarch64-linux-android24"
        echo "Libc: Bionic"
        cat > android-cross.txt << 'EOF'
        [binaries]
        c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
        cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
        ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        pkg-config = 'false'

        [properties]
        sys_root = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8'
        endian = 'little'
        EOF
        
        # Expand environment variables
        envsubst < android-cross.txt > android-cross-expanded.txt
        cat android-cross-expanded.txt
    
    - name: Setup Meson build for Android
      run: |
        echo "=== Meson Setup for Android (Bionic) ==="
        echo "Cross-file: android-cross-expanded.txt"
        echo "Build type: release"
        echo "Platform: Android ARM64"
        echo "Libc: Bionic"
        meson setup build_android \
          --cross-file android-cross-expanded.txt \
          -Dbuildtype=release
        echo "=== Meson configuration complete ==="
    
    - name: Build for Android
      run: |
        echo "=== Building for Android with Ninja ==="
        ninja -C build_android -v
        echo "=== Android build complete ==="
    
    - name: Verify Android build
      run: |
        echo "=== Built Libraries (Bionic) ==="
        echo "Checking file types:"
        file build_android/src/*.so
        echo ""
        echo "File sizes:"
        ls -lh build_android/src/*.so
        echo ""
        echo "Verifying Android binary:"
        readelf -h build_android/src/libVkLayer_VulkanFX_default.so | grep -E 'Class|Machine|OS/ABI' || true
        echo ""
        echo "=== Android build artifacts ready ==="
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-android-bionic-arm64
        path: |
          build_android/src/*.so
          build_android/config/VulkanFX.json
        retention-days: 30

  build-cmake-alternative:
    name: Build with CMake (Alternative)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake ninja-build \
          libvulkan-dev vulkan-headers \
          libx11-dev libxrandr-dev \
          gcc g++ pkg-config
    
    - name: Configure CMake
      run: |
        echo "=== CMake Configuration ==="
        echo "Generator: Ninja"
        echo "Build all variants: ON"
        cmake -B build_cmake -G Ninja -DBUILD_ALL_VARIANTS=ON
        echo "=== CMake configuration complete ==="
    
    - name: Build
      run: |
        echo "=== Building with CMake ==="
        echo "Parallel jobs: $(nproc)"
        cmake --build build_cmake -j$(nproc) --verbose
        echo "=== CMake build complete ==="
    
    - name: List built files
      run: |
        echo "Built libraries (CMake):"
        find build_cmake -name "*.so" -type f -exec file {} \;
        find build_cmake -name "*.so" -type f -exec ls -lh {} \;
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-cmake-linux
        path: |
          build_cmake/*.so
        retention-days: 30

  create-release-package:
    name: Create Release Package
    needs: [build-linux-glibc, build-android-bionic]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/VulkanFX'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create release packages
      run: |
        # Linux Glibc package
        mkdir -p release/linux-glibc/lib
        mkdir -p release/linux-glibc/config
        mkdir -p release/linux-glibc/docs
        
        cp artifacts/vulkanfx-linux-glibc-x86_64/*.so release/linux-glibc/lib/ || true
        cp artifacts/vulkanfx-linux-glibc-x86_64/*.json release/linux-glibc/config/ || true
        cp README.md BUILD_SYSTEMS.md CHANGELOG.md release/linux-glibc/docs/ || true
        
        cd release
        tar -czf VulkanFX-linux-glibc-x86_64-$(date +%Y%m%d).tar.gz linux-glibc
        cd ..
        
        # Android Bionic package
        mkdir -p release/android-bionic/lib
        mkdir -p release/android-bionic/config
        mkdir -p release/android-bionic/docs
        
        cp artifacts/vulkanfx-android-bionic-arm64/*.so release/android-bionic/lib/ || true
        cp artifacts/vulkanfx-android-bionic-arm64/*.json release/android-bionic/config/ || true
        cp README.md WINLATOR_GUIDE.md release/android-bionic/docs/ || true
        
        cd release
        tar -czf VulkanFX-android-bionic-arm64-$(date +%Y%m%d).tar.gz android-bionic
        cd ..
        
        ls -lh release/*.tar.gz
    
    - name: Upload release packages
      uses: actions/upload-artifact@v4
      with:
        name: vulkanfx-release-packages
        path: release/*.tar.gz
        retention-days: 90
