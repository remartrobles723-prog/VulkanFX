name: Test VulkanFX

on:
  push:
    branches: [ VulkanFX, main, master ]
  pull_request:
    branches: [ VulkanFX, main, master ]

jobs:
  test-build:
    name: Test Build and Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build cmake \
          libvulkan-dev vulkan-headers vulkan-tools \
          libx11-dev libxrandr-dev \
          gcc g++ pkg-config \
          file
    
    - name: Build with Meson
      run: |
        echo "=== Building VulkanFX with Meson ==="
        echo "Setting up build directory..."
        meson setup build
        echo ""
        echo "Building with Ninja..."
        ninja -C build -v
        echo ""
        echo "=== Build complete ==="
    
    - name: Verify libraries
      run: |
        echo "=== Verifying Built Libraries ==="
        echo ""
        for lib in build/src/*.so; do
          echo "━━━ $(basename $lib) ━━━"
          echo "File type:"
          file "$lib"
          echo ""
          echo "Size:"
          ls -lh "$lib"
          echo ""
          echo "Dependencies:"
          ldd "$lib" || true
          echo ""
          echo "Symbols:"
          nm -D "$lib" | grep -i "vkNegotiate" || echo "  Warning: vkNegotiateLoaderLayerInterfaceVersion not found"
          echo ""
        done
        echo "=== Verification complete ==="
    
    - name: Check library symbols
      run: |
        echo "=== Checking Vulkan Layer Symbols ==="
        echo ""
        echo "Required symbols:"
        nm -D build/src/libVkLayer_VulkanFX_default.so | grep -i "vkNegotiate" && echo "✓ vkNegotiateLoaderLayerInterfaceVersion found" || echo "✗ vkNegotiateLoaderLayerInterfaceVersion not found"
        echo ""
        echo "Exported functions:"
        nm -D build/src/libVkLayer_VulkanFX_default.so | grep " T " | head -20
        echo ""
        echo "=== Symbol check complete ==="
    
    - name: Validate layer manifest
      run: |
        echo "=== Validating Layer Manifest ==="
        echo ""
        if [ -f build/config/VulkanFX.json ]; then
          echo "Manifest file found: build/config/VulkanFX.json"
          echo ""
          echo "Contents:"
          cat build/config/VulkanFX.json
          echo ""
          echo "JSON validation:"
          python3 -m json.tool build/config/VulkanFX.json > /dev/null && echo "✓ Valid JSON" || echo "✗ Invalid JSON"
          echo ""
          echo "Checking required fields:"
          grep -q '"file_format_version"' build/config/VulkanFX.json && echo "✓ file_format_version present" || echo "✗ file_format_version missing"
          grep -q '"layer"' build/config/VulkanFX.json && echo "✓ layer section present" || echo "✗ layer section missing"
          grep -q '"name"' build/config/VulkanFX.json && echo "✓ name present" || echo "✗ name missing"
        else
          echo "✗ Warning: Layer manifest not found"
        fi
        echo ""
        echo "=== Manifest validation complete ==="
    
    - name: Test CMake build
      run: |
        echo "=== Testing CMake Build ==="
        echo ""
        echo "Configuring..."
        cmake -B build_cmake -DBUILD_ALL_VARIANTS=ON
        echo ""
        echo "Building..."
        cmake --build build_cmake --verbose
        echo ""
        echo "Verifying outputs..."
        find build_cmake -name "*.so" -type f -exec ls -lh {} \;
        echo ""
        echo "✓ CMake build successful!"
        echo ""
        echo "=== CMake test complete ==="

  test-compatibility:
    name: Test Vulkan Compatibility
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Vulkan SDK
      run: |
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk
    
    - name: Install build dependencies
      run: |
        sudo apt-get install -y \
          meson ninja-build \
          libx11-dev \
          gcc g++
    
    - name: Build VulkanFX
      run: |
        meson setup build
        ninja -C build
    
    - name: Test with vulkaninfo
      run: |
        export VK_LAYER_PATH="$(pwd)/build/config"
        export ENABLE_VULKANFX=1
        vulkaninfo --summary || echo "vulkaninfo test completed"

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cppcheck clang-format \
          libvulkan-dev libx11-dev
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,style,performance \
          --suppressions-list=.cppcheck-suppressions \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          -I src \
          -I subprojects/vkroots/include \
          src/*.cpp 2>&1 | tee cppcheck.log || true
        echo "Cppcheck completed. Check cppcheck.log for details."
    
    - name: Check for common issues
      run: |
        echo "Checking for common issues..."
        grep -r "TODO\|FIXME\|XXX" src/ || echo "No TODOs found"
    
    - name: Upload cppcheck results
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-results
        path: cppcheck.log
        retention-days: 7
