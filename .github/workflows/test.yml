name: Test VulkanFX

on:
  push:
    branches: [ VulkanFX, main, master ]
  pull_request:
    branches: [ VulkanFX, main, master ]

jobs:
  test-build:
    name: Test Build and Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build cmake \
          libvulkan-dev vulkan-headers vulkan-tools \
          libx11-dev libxrandr-dev \
          gcc g++ pkg-config \
          file
    
    - name: Build with Meson
      run: |
        meson setup build
        ninja -C build
    
    - name: Verify libraries
      run: |
        echo "Checking built libraries..."
        for lib in build/src/*.so; do
          echo "=== $lib ==="
          file "$lib"
          ldd "$lib" || true
          echo ""
        done
    
    - name: Check library symbols
      run: |
        echo "Checking Vulkan layer symbols..."
        nm -D build/src/libVkLayer_VulkanFX_default.so | grep -i "vkNegotiate" || echo "Warning: vkNegotiateLoaderLayerInterfaceVersion not found"
    
    - name: Validate layer manifest
      run: |
        echo "Validating layer manifest..."
        if [ -f build/config/VulkanFX.json ]; then
          cat build/config/VulkanFX.json
          # Check JSON validity
          python3 -m json.tool build/config/VulkanFX.json > /dev/null && echo "✓ Valid JSON"
        else
          echo "Warning: Layer manifest not found"
        fi
    
    - name: Test CMake build
      run: |
        cmake -B build_cmake -DBUILD_ALL_VARIANTS=ON
        cmake --build build_cmake
        echo "CMake build successful!"

  test-compatibility:
    name: Test Vulkan Compatibility
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Vulkan SDK
      run: |
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk
    
    - name: Install build dependencies
      run: |
        sudo apt-get install -y \
          meson ninja-build \
          libx11-dev \
          gcc g++
    
    - name: Build VulkanFX
      run: |
        meson setup build
        ninja -C build
    
    - name: Test with vulkaninfo
      run: |
        export VK_LAYER_PATH="$(pwd)/build/config"
        export ENABLE_VULKANFX=1
        vulkaninfo --summary || echo "vulkaninfo test completed"

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cppcheck clang-format \
          libvulkan-dev libx11-dev
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,style,performance \
          --suppressions-list=.cppcheck-suppressions \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          -I src \
          -I subprojects/vkroots/include \
          src/*.cpp 2>&1 | tee cppcheck.log || true
        echo "Cppcheck completed. Check cppcheck.log for details."
    
    - name: Check for common issues
      run: |
        echo "Checking for common issues..."
        grep -r "TODO\|FIXME\|XXX" src/ || echo "No TODOs found"
    
    - name: Upload cppcheck results
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-results
        path: cppcheck.log
        retention-days: 7
