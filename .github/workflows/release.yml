name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v0.4.0'

jobs:
  build-linux-glibc:
    name: Build for Linux (Glibc)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build \
          libvulkan-dev vulkan-headers \
          libx11-dev libxrandr-dev \
          gcc g++ pkg-config
    
    - name: Build with Meson
      run: |
        echo "=== Building VulkanFX for Linux (Glibc) ==="
        echo "Platform: Linux x86_64"
        echo "Libc: Glibc"
        echo "Build system: Meson"
        echo ""
        echo "Setting up build..."
        meson setup build
        echo ""
        echo "Building..."
        ninja -C build -v
        echo ""
        echo "=== Build complete ==="
        echo ""
        echo "Built libraries:"
        ls -lh build/src/*.so
    
    - name: Package Linux release
      run: |
        echo "=== Packaging Linux (Glibc) Release ==="
        echo ""
        mkdir -p release/linux-glibc-x86_64/lib
        mkdir -p release/linux-glibc-x86_64/config
        mkdir -p release/linux-glibc-x86_64/docs
        mkdir -p release/linux-glibc-x86_64/scripts
        mkdir -p release/linux-glibc-x86_64/fx
        
        # Copy libraries
        cp build/src/*.so release/linux-glibc-x86_64/lib/
        
        # Copy configs
        cp config/VulkanFX.conf release/linux-glibc-x86_64/config/
        cp build/config/VulkanFX.json release/linux-glibc-x86_64/config/
        
        # Copy documentation
        cp README.md release/linux-glibc-x86_64/docs/
        cp CHANGELOG.md release/linux-glibc-x86_64/docs/ || true
        cp BUILD_SYSTEMS.md release/linux-glibc-x86_64/docs/ || true
        cp WINLATOR_GUIDE.md release/linux-glibc-x86_64/docs/ || true
        cp IMAGE_TESTING.md release/linux-glibc-x86_64/docs/ || true
        cp GITHUB_ACTIONS.md release/linux-glibc-x86_64/docs/ || true
        
        # Copy scripts
        cp *.sh release/linux-glibc-x86_64/scripts/ 2>/dev/null || true
        
        # Copy ReShade shaders
        cp -r fx/* release/linux-glibc-x86_64/fx/ 2>/dev/null || true
        
        # Create archive
        echo ""
        echo "Creating archive..."
        cd release
        tar -czf VulkanFX-linux-glibc-x86_64.tar.gz linux-glibc-x86_64
        cd ..
        echo ""
        echo "Archive created:"
        ls -lh release/VulkanFX-linux-glibc-x86_64.tar.gz
        echo ""
        echo "=== Linux package complete ==="
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VulkanFX-linux-glibc-x86_64
        path: release/VulkanFX-linux-glibc-x86_64.tar.gz

  build-android-bionic:
    name: Build for Android (Bionic)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
        add-to-path: true
    
    - name: Install Meson
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip ninja-build gettext-base
        pip3 install meson
    
    - name: Create Meson cross-file
      run: |
        cat > android-cross.txt << 'EOF'
        [binaries]
        c = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
        cpp = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
        ar = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        pkg-config = 'false'

        [properties]
        sys_root = '$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8'
        endian = 'little'
        EOF
        
        envsubst < android-cross.txt > android-cross-expanded.txt
    
    - name: Build with Meson for Android
      run: |
        echo "=== Building VulkanFX for Android (Bionic) ==="
        echo "Platform: Android ARM64"
        echo "Libc: Bionic"
        echo "Build system: Meson + NDK"
        echo "NDK: $ANDROID_NDK_HOME"
        echo ""
        echo "Setting up build..."
        meson setup build_android \
          --cross-file android-cross-expanded.txt \
          -Dbuildtype=release
        echo ""
        echo "Building..."
        ninja -C build_android -v
        echo ""
        echo "=== Build complete ==="
        echo ""
        echo "Built libraries:"
        ls -lh build_android/src/*.so
    
    - name: Verify build
      run: |
        echo "=== Verifying Android Bionic Build ==="
        echo ""
        echo "File types:"
        file build_android/src/*.so
        echo ""
        echo "Binary details:"
        readelf -h build_android/src/libVkLayer_VulkanFX_default.so | grep -E 'Class|Machine|OS/ABI|Type'
        echo ""
        echo "=== Verification complete ==="
    
    - name: Package Android release
      run: |
        echo "=== Packaging Android (Bionic) Release ==="
        echo ""
        mkdir -p release/android-bionic-arm64/lib
        mkdir -p release/android-bionic-arm64/config
        mkdir -p release/android-bionic-arm64/docs
        mkdir -p release/android-bionic-arm64/fx
        
        # Copy libraries
        cp build_android/src/*.so release/android-bionic-arm64/lib/
        
        # Copy configs
        cp config/VulkanFX.conf release/android-bionic-arm64/config/
        cp build_android/config/VulkanFX.json release/android-bionic-arm64/config/ || true
        
        # Copy documentation
        cp README.md release/android-bionic-arm64/docs/
        cp WINLATOR_GUIDE.md release/android-bionic-arm64/docs/ || true
        cp BUILD_SYSTEMS.md release/android-bionic-arm64/docs/ || true
        
        # Copy ReShade shaders
        cp -r fx/* release/android-bionic-arm64/fx/ 2>/dev/null || true
        
        # Create archive
        echo ""
        echo "Creating archive..."
        cd release
        tar -czf VulkanFX-android-bionic-arm64.tar.gz android-bionic-arm64
        cd ..
        echo ""
        echo "Archive created:"
        ls -lh release/VulkanFX-android-bionic-arm64.tar.gz
        echo ""
        echo "=== Android package complete ==="
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VulkanFX-android-bionic-arm64
        path: release/VulkanFX-android-bionic-arm64.tar.gz

  create-github-release:
    name: Create GitHub Release
    needs: [build-linux-glibc, build-android-bionic]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create release notes
      run: |
        cat > RELEASE_NOTES.md << 'EOF'
        # VulkanFX Release
        
        ## 🎮 Vulkan Post-Processing Layer
        
        ### Features
        - ✅ CAS (Contrast Adaptive Sharpening)
        - ✅ FXAA (Fast Approximate Anti-Aliasing)
        - ✅ SMAA (Subpixel Morphological Anti-Aliasing)
        - ✅ DLS (Deep Learning Super Sampling)
        - ✅ ReShade FX shader support
        - ✅ Vulkan 1.0 - 1.4 compatible
        
        ### Platforms
        
        #### Linux (Glibc) - Desktop Linux
        - Ubuntu, Debian, Fedora, Arch, etc.
        - x86_64 architecture
        - Built with Meson
        
        #### Android (Bionic) - Termux & Winlator
        - Android 7.0+ (API 24+)
        - ARM64 (aarch64) architecture
        - Built with Meson + Android NDK
        - Perfect for Termux and Winlator
        
        ### Build Systems
        - ✅ Meson (primary)
        - ✅ CMake (alternative)
        - ✅ Android Studio NDK
        
        ### Installation
        
        **Linux:**
        ```bash
        tar -xzf VulkanFX-linux-glibc-x86_64.tar.gz
        cd linux-glibc-x86_64
        cp lib/*.so ~/.local/lib/
        cp config/VulkanFX.json ~/.local/share/vulkan/implicit_layer.d/
        ```
        
        **Android/Termux/Winlator:**
        ```bash
        tar -xzf VulkanFX-android-bionic-arm64.tar.gz
        cd android-bionic-arm64
        cp lib/*.so ~/.local/lib/
        cp config/VulkanFX.json ~/.local/share/vulkan/implicit_layer.d/
        ```
        
        ### Documentation
        - README.md - Quick start guide
        - BUILD_SYSTEMS.md - Build instructions
        - WINLATOR_GUIDE.md - Winlator integration
        - CHANGELOG.md - Version history
        
        ### Support
        - Issues: https://github.com/remartrobles723-prog/VulkanFX/issues
        - Discussions: https://github.com/remartrobles723-prog/VulkanFX/discussions
        EOF
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/VulkanFX-linux-glibc-x86_64/*.tar.gz
          artifacts/VulkanFX-android-bionic-arm64/*.tar.gz
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
