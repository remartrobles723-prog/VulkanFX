name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v0.4.0'

jobs:
  build-release:
    name: Build Release for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            arch: x86_64
          - os: ubuntu-latest
            platform: android-arm64
            arch: arm64-v8a
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies (Linux)
      if: matrix.platform == 'linux-x86_64'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build cmake \
          libvulkan-dev vulkan-headers \
          libx11-dev \
          gcc g++ pkg-config
    
    - name: Setup Android NDK
      if: matrix.platform == 'android-arm64'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
    
    - name: Build for Linux
      if: matrix.platform == 'linux-x86_64'
      run: |
        meson setup build
        ninja -C build
        
        # Also build with CMake
        cmake -B build_cmake -DBUILD_ALL_VARIANTS=ON
        cmake --build build_cmake
    
    - name: Build for Android
      if: matrix.platform == 'android-arm64'
      run: |
        cmake -B build_android \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.arch }} \
          -DANDROID_PLATFORM=android-24 \
          -DBUILD_ALL_VARIANTS=ON
        cmake --build build_android
    
    - name: Package release (Linux)
      if: matrix.platform == 'linux-x86_64'
      run: |
        mkdir -p release/${{ matrix.platform }}/lib
        mkdir -p release/${{ matrix.platform }}/config
        mkdir -p release/${{ matrix.platform }}/docs
        mkdir -p release/${{ matrix.platform }}/scripts
        
        # Copy libraries
        cp build/src/*.so release/${{ matrix.platform }}/lib/
        
        # Copy configs
        cp config/VulkanFX.conf release/${{ matrix.platform }}/config/
        cp build/config/VulkanFX.json release/${{ matrix.platform }}/config/
        
        # Copy documentation
        cp README.md release/${{ matrix.platform }}/docs/
        cp CHANGELOG.md release/${{ matrix.platform }}/docs/ || true
        cp BUILD_SYSTEMS.md release/${{ matrix.platform }}/docs/ || true
        cp WINLATOR_GUIDE.md release/${{ matrix.platform }}/docs/ || true
        cp IMAGE_TESTING.md release/${{ matrix.platform }}/docs/ || true
        
        # Copy scripts
        cp *.sh release/${{ matrix.platform }}/scripts/ || true
        
        # Copy ReShade shaders
        cp -r fx release/${{ matrix.platform }}/ || true
        
        # Create archive
        cd release
        tar -czf VulkanFX-${{ matrix.platform }}.tar.gz ${{ matrix.platform }}
        cd ..
    
    - name: Package release (Android)
      if: matrix.platform == 'android-arm64'
      run: |
        mkdir -p release/${{ matrix.platform }}/lib
        mkdir -p release/${{ matrix.platform }}/config
        mkdir -p release/${{ matrix.platform }}/docs
        
        # Copy libraries
        find build_android -name "*.so" -exec cp {} release/${{ matrix.platform }}/lib/ \;
        
        # Copy configs
        cp config/VulkanFX.conf release/${{ matrix.platform }}/config/
        
        # Copy documentation
        cp README.md release/${{ matrix.platform }}/docs/
        cp WINLATOR_GUIDE.md release/${{ matrix.platform }}/docs/ || true
        
        # Create archive
        cd release
        tar -czf VulkanFX-${{ matrix.platform }}.tar.gz ${{ matrix.platform }}
        cd ..
    
    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: VulkanFX-${{ matrix.platform }}
        path: release/VulkanFX-${{ matrix.platform }}.tar.gz
        retention-days: 90

  create-github-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create release notes
      run: |
        cat > RELEASE_NOTES.md << 'EOF'
        # VulkanFX Release
        
        ## Features
        - Vulkan post-processing layer
        - CAS, FXAA, SMAA, DLS effects
        - ReShade FX shader support
        - Vulkan 1.0 - 1.4 compatible
        - Works with Winlator/Wine/Proton
        
        ## Platforms
        - Linux x86_64
        - Android ARM64 (Termux, Winlator)
        
        ## Build Systems
        - Meson
        - CMake
        - Android Studio NDK
        
        ## Installation
        See README.md for installation instructions.
        
        ## Changelog
        See CHANGELOG.md for detailed changes.
        EOF
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*.tar.gz
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
