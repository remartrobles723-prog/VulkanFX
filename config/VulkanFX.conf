# VulkanFX Configuration with ReShade Effects
# Using effects from fx/Shaders folder

# RESHADE EFFECTS - Very visible!
# Format: reshade(shader_name)
# Available shaders: Daltonize, Deband, LUT, DisplayDepth
effects = reshade(Daltonize.fx)

# ReShade paths
reshadeTexturePath = "/data/data/com.termux/files/home/VulkanFX/fx/Textures"
reshadeIncludePath = "/data/data/com.termux/files/home/VulkanFX/fx/Shaders"

depthCapture = off

# Toggle key
toggleKey = Home

# Enable on launch
enableOnLaunch = True

# CAS settings (if using cas effect)
casSharpness = 1.0

# DLS settings
dlsSharpness = 0.95
dlsDenoise = 0.05

# FXAA settings
fxaaQualitySubpix = 0.75
fxaaQualityEdgeThreshold = 0.125
fxaaQualityEdgeThresholdMin = 0.0312

# SMAA settings
smaaEdgeDetection = luma
smaaThreshold = 0.05
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25

# LUT file (if using lut effect)
lutFile = "/path/to/lut"
